name: update profile art

# Re-scrape the contribution calendar and redraw the heatmap. Only this
# one asset is data-driven; the portrait, monogram and info card change
# only when their sources do, so they stay committed and untouched here.

on:
  schedule:
    # 06:17 UTC daily. An off-the-hour minute avoids the congestion (and
    # the queueing delays) that hit cron jobs landing exactly on :00.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege: the job only needs to push the regenerated SVG back.
permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: install deps
        run: pip install -r scripts/requirements.txt

      - name: scrape contributions
        run: |
          python scripts/fetch_contributions.py \
            --user "${{ github.repository_owner }}" \
            --out data/contributions.json

      - name: redraw heatmap
        run: |
          python scripts/render_heatmap_svg.py \
            --data data/contributions.json \
            --palette hybrid \
            --out contrib-heatmap.svg \
            --title "${{ github.repository_owner }} on GitHub"

      - name: commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # [skip ci] so this commit can't retrigger the workflow.
          commit_message: "chore: refresh contribution art [skip ci]"
          file_pattern: contrib-heatmap.svg data/contributions.json
